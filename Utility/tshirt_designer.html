<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 커스텀 티셔츠 디자이너</title>
    <!-- Three.js 및 관련 라이브러리 (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #121212;
            color: #e0e0e0;
        }

        /* 3D 뷰포트 */
        #canvas-container {
            flex: 1;
            height: 100%;
            position: relative;
            background: radial-gradient(circle at center, #2a2a2a 0%, #111111 100%);
        }

        /* 카메라 빠른 이동 패널 */
        .view-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }

        .view-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            font-size: 13px;
        }

        .view-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 제어 사이드바 */
        #sidebar {
            width: 380px;
            height: 100%;
            background: #1e1e1e;
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .section {
            background: #262626;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
            margin-top: 10px;
        }

        label:first-child {
            margin-top: 0;
        }

        select,
        input[type="number"],
        input[type="color"],
        input[type="file"] {
            width: 100%;
            background: #141414;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #3b82f6;
        }

        .range-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-group span {
            font-size: 12px;
            width: 40px;
            text-align: right;
            color: #888;
        }

        /* 로고 관리 리스트 */
        .logo-item {
            background: #1a1a1a;
            border: 1px solid #383838;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
        }

        .logo-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .upload-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #3b82f6;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: background 0.2s;
        }

        .upload-btn:hover {
            background: #2563eb;
        }

        /* 토글 스위치 형태 */
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>

<body>

    <!-- 3D 캔버스 영역 -->
    <div id="canvas-container">
        <div class="view-controls">
            <button class="view-btn" onclick="setView('front')">정면 (앞)</button>
            <button class="view-btn" onclick="setView('back')">후면 (뒤)</button>
            <button class="view-btn" onclick="setView('left')">좌측면</button>
            <button class="view-btn" onclick="setView('right')">우측면</button>
            <button class="view-btn" onclick="setView('reset')">3D 자유 회전</button>
        </div>
    </div>

    <!-- 컨트롤 사이드바 -->
    <div id="sidebar">

        <!-- 1. 티셔츠 기본 옵션 -->
        <div class="section">
            <h2>1. 티셔츠 핏 & 사이즈</h2>
            <label>소매 타입</label>
            <select id="sleeveType" onchange="updateTshirtMesh()">
                <option value="short">반팔 (Short Sleeve)</option>
                <option value="long">긴팔 (Long Sleeve)</option>
            </select>

            <label>핏 스타일</label>
            <select id="fitType" onchange="applyPresetFit()">
                <option value="standard">Standard Fit (기본)</option>
                <option value="oversize">Oversize Fit (오버핏)</option>
                <option value="sports">Slim / Sports Fit (슬림/스포츠)</option>
                <option value="custom">직접 수치 입력 (Custom)</option>
            </select>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;">
                <div>
                    <label>가슴 너비(Scale X)</label>
                    <input type="number" id="scaleX" value="1.0" step="0.05" onchange="updateCustomScale()">
                </div>
                <div>
                    <label>총장(Scale Y)</label>
                    <input type="number" id="scaleY" value="1.0" step="0.05" onchange="updateCustomScale()">
                </div>
            </div>

            <label>티셔츠 원단 색상</label>
            <input type="color" id="tshirtColor" value="#ffffff" onchange="updateTshirtColor(this.value)">
        </div>

        <!-- 2. 로고 업로드 및 설정 -->
        <div class="section">
            <h2>2. 로고 레이어 관리</h2>
            <label class="upload-btn">
                + 새 로고 이미지 업로드
                <input type="file" id="logoInput" accept="image/*" style="display:none;"
                    onchange="handleLogoUpload(event)">
            </label>

            <div id="logoList"></div>
        </div>

        <!-- 3. 실사 느낌 & 조명 연출 -->
        <div class="section">
            <h2>3. 재질 & 조명 연출 (실사화)</h2>

            <label>조명 모드 (주/야간)</label>
            <select id="lightMode" onchange="updateLightingMode(this.value)">
                <option value="day">주간 (Daylight)</option>
                <option value="night">야간/스튜디오 (Studio Night)</option>
                <option value="sunset">노을 (Warm Sunset)</option>
            </select>

            <label>조명 회전 각도</label>
            <div class="range-group">
                <input type="range" id="lightAngle" min="0" max="360" value="45" oninput="updateLightAngle(this.value)">
                <span id="lightAngleVal">45°</span>
            </div>

            <label>원단 주름 및 거칠기 (Roughness)</label>
            <div class="range-group">
                <input type="range" id="fabricRoughness" min="0.1" max="1.0" step="0.05" value="0.7"
                    oninput="updateFabricMaterial()">
                <span id="roughnessVal">0.7</span>
            </div>
        </div>

    </div>

    <script>
        // --- 1. Three.js 기본 씬 설정 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 2. 조명 시스템 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(2, 3, 2);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const dirLightHelper = new THREE.Group();
        dirLightHelper.add(dirLight);
        scene.add(dirLightHelper);

        // --- 3. 절차적 캔버스 텍스처 (기본 원단 주름 효과 렌더링) ---
        function createFabricTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 1024, 1024);

            // 음영(주름) 효과 그리기
            const grad = ctx.createLinearGradient(0, 0, 1024, 1024);
            grad.addColorStop(0, 'rgba(200,200,200,0.1)');
            grad.addColorStop(0.5, 'rgba(0,0,0,0.05)');
            grad.addColorStop(1, 'rgba(220,220,220,0.1)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // 원단 미세 미세 패턴 (Bump Map용)
            for (let i = 0; i < 1024; i += 4) {
                ctx.fillStyle = (i % 8 === 0) ? 'rgba(0,0,0,0.03)' : 'rgba(255,255,255,0.03)';
                ctx.fillRect(0, i, 1024, 2);
            }

            return new THREE.CanvasTexture(canvas);
        }

        const bumpTexture = createFabricTexture();
        bumpTexture.wrapS = THREE.RepeatWrapping;
        bumpTexture.wrapT = THREE.RepeatWrapping;
        bumpTexture.repeat.set(4, 4);

        // --- 4. 티셔츠 3D 메쉬 생성 ---
        let tshirtGroup = new THREE.Group();
        let tshirtMaterial;
        let logos = []; // 로고 객체 배열

        function buildTshirtGeometry(isLongSleeve) {
            const group = new THREE.Group();

            tshirtMaterial = new THREE.MeshStandardMaterial({
                color: document.getElementById('tshirtColor').value,
                roughness: parseFloat(document.getElementById('fabricRoughness').value),
                metalness: 0.05,
                bumpMap: bumpTexture,
                bumpScale: 0.015,
            });

            // --- 1. 정밀한 몸통 (Vertex 변형 방식) ---
            // 촘촘한 원통을 만든 뒤, 정점(Vertex)의 좌표를 수학적으로 깎아서 인체공학적 핏을 만듭니다.
            const torsoGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 64, 32);
            const pos = torsoGeo.attributes.position;
            const vec3 = new THREE.Vector3();

            for (let i = 0; i < pos.count; i++) {
                vec3.fromBufferAttribute(pos, i);
                let x = vec3.x;
                let y = vec3.y;
                let z = vec3.z;

                // 1) 앞뒤 두께를 납작하게 누름 (티셔츠 형태)
                z *= 0.4;
                // 가슴 부분은 밋밋하지 않게 살짝 더 볼륨감 있게
                if (y > 0 && y < 0.5) z += 0.05 * Math.cos(x * Math.PI);

                // 2) 어깨 라인 확장 및 슬로프(처짐) 구현
                if (y > 0.2) {
                    const expand = (y - 0.2) * 1.8; // 위로 갈수록 넓어짐
                    x *= (1 + expand);

                    // 어깨 바깥쪽으로 갈수록 아래로 처지게 (자연스러운 승모근~어깨 핏)
                    if (Math.abs(x) > 0.4) {
                        y -= (Math.abs(x) - 0.4) * 0.25;
                    }
                }

                // 3) 넥라인 (목 파임)
                if (y > 0.5 && Math.abs(x) < 0.35) {
                    let normalizedX = Math.abs(x) / 0.35;
                    let dip = 0.18 * Math.cos(normalizedX * Math.PI / 2);
                    if (z > 0) {
                        y -= dip; // 앞목은 깊게 파임
                    } else {
                        y -= dip * 0.3; // 뒷목은 얕게 파임
                    }
                }

                // 4) 허리 라인 살짝 들어가게 (핏 조절)
                if (y < 0.2 && y > -0.6) {
                    x *= 0.96;
                }

                pos.setXYZ(i, x, y, z);
            }
            torsoGeo.computeVertexNormals(); // 변형 후 빛 반사(Normal)를 둥글게 재계산

            const torso = new THREE.Mesh(torsoGeo, tshirtMaterial);
            torso.castShadow = true;
            torso.receiveShadow = true;
            group.add(torso);


            // --- 2. 어깨선에 정확히 밀착되는 소매 ---
            const sleeveLength = isLongSleeve ? 1.2 : 0.4;
            const sleeveRadiusTop = 0.25;
            const sleeveRadiusBottom = isLongSleeve ? 0.14 : 0.22;

            const sleeveGeo = new THREE.CylinderGeometry(sleeveRadiusTop, sleeveRadiusBottom, sleeveLength, 32, 16);

            // 소매도 몸통 두께에 맞춰 납작하게 찌그러뜨림
            const sPos = sleeveGeo.attributes.position;
            for (let i = 0; i < sPos.count; i++) {
                let z = sPos.getZ(i);
                sPos.setZ(i, z * 0.6);
            }
            sleeveGeo.computeVertexNormals();

            // ★ 핵심: 소매의 회전 축을 도형 '중심'이 아닌 '어깨 끝단(위쪽)'으로 이동시킵니다.
            // 이렇게 해야 몸통과 떨어져 보이는 괴리감이 사라집니다.
            sleeveGeo.translate(0, -sleeveLength / 2, 0);

            // 오른팔 (보는 방향 왼쪽)
            const rightSleeve = new THREE.Mesh(sleeveGeo, tshirtMaterial);
            rightSleeve.position.set(-0.82, 0.62, 0); // 어깨 슬로프 끝부분 좌표에 정확히 고정
            rightSleeve.rotation.z = Math.PI / 4.5;   // 아래로 약 40도 자연스럽게 떨어지게 회전
            rightSleeve.castShadow = true;
            group.add(rightSleeve);

            // 왼팔 (보는 방향 오른쪽)
            const leftSleeve = new THREE.Mesh(sleeveGeo, tshirtMaterial);
            leftSleeve.position.set(0.82, 0.62, 0);
            leftSleeve.rotation.z = -Math.PI / 4.5;
            leftSleeve.castShadow = true;
            group.add(leftSleeve);

            return group;
        }

        function updateTshirtMesh() {
            const isLong = document.getElementById('sleeveType').value === 'long';
            scene.remove(tshirtGroup);
            tshirtGroup = buildTshirtGeometry(isLong);
            scene.add(tshirtGroup);
            applyPresetFit();

            // 기존 업로드된 로고 재부착
            logos.forEach(logo => tshirtGroup.add(logo.mesh));
        }

        // --- 5. 핏 & 사이즈 조절 ---
        function applyPresetFit() {
            const fit = document.getElementById('fitType').value;
            const scaleXInput = document.getElementById('scaleX');
            const scaleYInput = document.getElementById('scaleY');

            if (fit === 'standard') {
                scaleXInput.value = 1.0; scaleYInput.value = 1.0;
            } else if (fit === 'oversize') {
                scaleXInput.value = 1.25; scaleYInput.value = 1.1;
            } else if (fit === 'sports') {
                scaleXInput.value = 0.9; scaleYInput.value = 0.95;
            }
            updateCustomScale();
        }

        function updateCustomScale() {
            const sx = parseFloat(document.getElementById('scaleX').value);
            const sy = parseFloat(document.getElementById('scaleY').value);
            tshirtGroup.scale.set(sx, sy, sx);
        }

        function updateTshirtColor(colorHex) {
            if (tshirtMaterial) tshirtMaterial.color.set(colorHex);
        }

        // --- 6. 로고 시스템 (복수 업로드, 위치, 크기, 색상 틴트) ---
        function handleLogoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    addLogoToTshirt(img);
                };
            };
            reader.readAsDataURL(file);
        }

        function addLogoToTshirt(img) {
            const texture = new THREE.Texture(img);
            texture.needsUpdate = true;

            // 로고 메쉬 (Plane)
            const aspect = img.width / img.height;
            const geo = new THREE.PlaneGeometry(0.3 * aspect, 0.3);
            const mat = new THREE.MeshStandardMaterial({
                map: texture,
                transparent: true,
                polygonOffset: true,
                polygonOffsetFactor: -4, // 티셔츠 표면과 겹침(Z-fighting) 방지
                roughness: 0.5
            });

            const logoMesh = new THREE.Mesh(geo, mat);
            // 초기 위치: 앞면 가슴 중앙
            logoMesh.position.set(0, 0.2, 0.37);

            const logoId = Date.now();
            const logoData = {
                id: logoId,
                mesh: logoMesh,
                material: mat,
                posX: 0, posY: 0.2, posZ: 0.37,
                scale: 1,
                color: '#ffffff',
                side: 'front'
            };

            logos.push(logoData);
            tshirtGroup.add(logoMesh);
            renderLogoControls();
        }

        function renderLogoControls() {
            const listEl = document.getElementById('logoList');
            listEl.innerHTML = '';

            logos.forEach((logo, index) => {
                const item = document.createElement('div');
                item.className = 'logo-item';
                item.innerHTML = `
          <div class="logo-item-header">
            <span>로고 #${index + 1}</span>
            <button class="btn-danger" onclick="removeLogo(${logo.id})">삭제</button>
          </div>
          <label>부착 위치 (면)</label>
          <select onchange="updateLogoSide(${logo.id}, this.value)">
            <option value="front" ${logo.side === 'front' ? 'selected' : ''}>앞면 (Front)</option>
            <option value="back" ${logo.side === 'back' ? 'selected' : ''}>뒷면 (Back)</option>
          </select>
          
          <label>위치 Y (상/하)</label>
          <input type="range" min="-0.4" max="0.4" step="0.02" value="${logo.posY}" oninput="updateLogoTransform(${logo.id}, 'posY', this.value)">
          
          <label>위치 X (좌/우)</label>
          <input type="range" min="-0.25" max="0.25" step="0.02" value="${logo.posX}" oninput="updateLogoTransform(${logo.id}, 'posX', this.value)">
          
          <label>크기 (Scale)</label>
          <input type="range" min="0.2" max="2.5" step="0.1" value="${logo.scale}" oninput="updateLogoTransform(${logo.id}, 'scale', this.value)">
          
          <label>로고 필터 색상</label>
          <input type="color" value="${logo.color}" onchange="updateLogoColor(${logo.id}, this.value)">
        `;
                listEl.appendChild(item);
            });
        }

        function updateLogoTransform(id, prop, val) {
            const logo = logos.find(l => l.id === id);
            if (!logo) return;

            const numVal = parseFloat(val);
            logo[prop] = numVal;

            if (prop === 'posY') logo.mesh.position.y = numVal;
            if (prop === 'posX') logo.mesh.position.x = numVal;
            if (prop === 'scale') logo.mesh.scale.set(numVal, numVal, 1);
        }

        function updateLogoSide(id, side) {
            const logo = logos.find(l => l.id === id);
            if (!logo) return;
            logo.side = side;

            if (side === 'front') {
                logo.mesh.position.z = 0.37;
                logo.mesh.rotation.y = 0;
            } else if (side === 'back') {
                logo.mesh.position.z = -0.37;
                logo.mesh.rotation.y = Math.PI;
            }
        }

        function updateLogoColor(id, hexColor) {
            const logo = logos.find(l => l.id === id);
            if (logo) {
                logo.color = hexColor;
                logo.material.color.set(hexColor);
            }
        }

        function removeLogo(id) {
            const index = logos.findIndex(l => l.id === id);
            if (index > -1) {
                tshirtGroup.remove(logos[index].mesh);
                logos.splice(index, 1);
                renderLogoControls();
            }
        }

        // --- 7. 시안 프리셋 카메라 각도 ---
        function setView(view) {
            const duration = 1000;
            let targetRotation = 0;

            if (view === 'front') targetRotation = 0;
            else if (view === 'back') targetRotation = Math.PI;
            else if (view === 'left') targetRotation = Math.PI / 2;
            else if (view === 'right') targetRotation = -Math.PI / 2;
            else if (view === 'reset') {
                controls.reset();
                return;
            }

            // 회전 애니메이션
            const startAngle = tshirtGroup.rotation.y;
            const startTime = performance.now();

            function animateCamera(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                tshirtGroup.rotation.y = startAngle + (targetRotation - startAngle) * progress;

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            requestAnimationFrame(animateCamera);
        }

        // --- 8. 조명/주름/실사 연출 조절 ---
        function updateLightingMode(mode) {
            if (mode === 'day') {
                ambientLight.intensity = 0.6;
                dirLight.intensity = 0.8;
                dirLight.color.setHex(0xffffff);
                scene.background = null;
            } else if (mode === 'night') {
                ambientLight.intensity = 0.2;
                dirLight.intensity = 1.2;
                dirLight.color.setHex(0x99ccff); // 차가운 스튜디오 조명
            } else if (mode === 'sunset') {
                ambientLight.intensity = 0.4;
                dirLight.intensity = 1.0;
                dirLight.color.setHex(0xffaa55); // 노을빛
            }
        }

        function updateLightAngle(val) {
            document.getElementById('lightAngleVal').innerText = val + '°';
            const rad = (val * Math.PI) / 180;
            dirLightHelper.rotation.y = rad;
        }

        function updateFabricMaterial() {
            const val = parseFloat(document.getElementById('fabricRoughness').value);
            document.getElementById('roughnessVal').innerText = val;
            if (tshirtMaterial) tshirtMaterial.roughness = val;
        }

        // --- 9. 창 크기 조절 대응 및 루프 ---
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 초기화 함수 실행
        updateTshirtMesh();
        animate();
    </script>
</body>

</html>
