<style>

  * { box-sizing: border-box; }
  body { margin:0; font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 1180px; margin: 28px auto; padding: 0 18px; }
  .card { background:var(--card); border-radius:22px; box-shadow:0 18px 45px rgba(15,23,42,.10); padding:28px; }

  .stat b { display:block; font-size:23px; letter-spacing:-.03em; }
  .stat span { color:var(--muted); font-size:13px; }
  .chartBox { position:relative; width:100%; height:560px; border:1px solid #e5e7eb; border-radius:18px; overflow:hidden; background:linear-gradient(180deg,#fff 0%,#fbfdff 100%); }
  svg { width:100%; height:100%; display:block; }
  .axisText { fill:#6b7280; font-size:12px; }
  .kmText { fill:#374151; font-size:12px; font-weight:600; }
  .titleText { fill:#111827; font-size:13px; font-weight:700; }
  .tooltip { position:absolute; display:none; pointer-events:none; min-width:190px; background:rgba(17,24,39,.94); color:#fff; padding:11px 13px; border-radius:12px; font-size:13px; box-shadow:0 12px 30px rgba(0,0,0,.25); z-index:5; }
  .tooltip strong { display:block; font-size:15px; margin-bottom:5px; }
  .tooltip div { margin-top:2px; color:#e5e7eb; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; color:#4b5563; font-size:13px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .note { color:#6b7280; font-size:13px; margin-top:12px; line-height:1.6; }
  @media (max-width:760px) { .head { display:block; } .stats { grid-template-columns: repeat(2,1fr); } .card { padding:18px; } .chartBox { height:430px; } h1 { font-size:24px; } }

const config = { totalKm: 21.1, turnKm: 10.55, yMin: 150, yMax: 550, minPoint: {"km": 0.03, "ele": 190.8, "src": 0.03, "section": "왕복 전반"}, maxPoint: {"km": 10.55, "ele": 513.2, "src": 10.55, "section": "왕복 전반"} };
const chart = document.getElementById('chart');
const tooltip = document.getElementById('tooltip');

function draw() {
  const w = chart.clientWidth;
  const h = chart.clientHeight;
  const margin = { top: 34, right: 34, bottom: 58, left: 72 };
  const iw = w - margin.left - margin.right;
  const ih = h - margin.top - margin.bottom;
  const x = km => margin.left + (km / config.totalKm) * iw;
  const y = ele => margin.top + (config.yMax - ele) / (config.yMax - config.yMin) * ih;
  const points = data.map(d => `${x(d.km).toFixed(2)},${y(d.ele).toFixed(2)}`).join(' ');
  const area = `${margin.left},${y(config.yMin)} ` + points + ` ${x(config.totalKm)},${y(config.yMin)}`;

  let yGrid = '';
  for (let v = config.yMin; v <= config.yMax; v += 50) {
    yGrid += `<line x1="${margin.left}" y1="${y(v)}" x2="${w-margin.right}" y2="${y(v)}" stroke="#e5e7eb" stroke-width="1"/>`;
    yGrid += `<text x="${margin.left-14}" y="${y(v)+4}" text-anchor="end" class="axisText">${v}m</text>`;
  }
  let xGrid = '';
  for (let v = 0; v <= 21; v += 1) {
    xGrid += `<line x1="${x(v)}" y1="${margin.top}" x2="${x(v)}" y2="${h-margin.bottom}" stroke="${v % 5 === 0 ? '#d1d5db' : '#edf2f7'}" stroke-width="1"/>`;
    xGrid += `<text x="${x(v)}" y="${h-margin.bottom+25}" text-anchor="middle" class="axisText">${v}</text>`;
  }
  xGrid += `<text x="${x(21.1)}" y="${h-margin.bottom+25}" text-anchor="middle" class="axisText">21.1</text>`;

  const minP = config.minPoint, maxP = config.maxPoint;
  const marker = (p, label, color, dy) => `
    <g>
      <line x1="${x(p.km)}" y1="${y(p.ele)}" x2="${x(p.km)}" y2="${h-margin.bottom}" stroke="${color}" stroke-width="1.3" stroke-dasharray="4 4" opacity=".75"/>
      <circle cx="${x(p.km)}" cy="${y(p.ele)}" r="5.5" fill="${color}" stroke="#fff" stroke-width="2"/>
      <rect x="${Math.min(Math.max(x(p.km)-54, margin.left), w-margin.right-108)}" y="${y(p.ele)+dy}" width="108" height="28" rx="8" fill="${color}" opacity=".95"/>
      <text x="${Math.min(Math.max(x(p.km), margin.left+54), w-margin.right-54)}" y="${y(p.ele)+dy+18}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${label} ${p.ele.toFixed(1)}m</text>
    </g>`;

  chart.querySelectorAll('svg').forEach(s=>s.remove());
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `
    <defs>
      <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3b82f6" stop-opacity=".30"/>
        <stop offset="100%" stop-color="#3b82f6" stop-opacity=".04"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="${w}" height="${h}" fill="transparent"/>
    ${yGrid}
    ${xGrid}
    <line x1="${margin.left}" y1="${h-margin.bottom}" x2="${w-margin.right}" y2="${h-margin.bottom}" stroke="#9ca3af"/>
    <line x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${h-margin.bottom}" stroke="#9ca3af"/>
    <polygon points="${area}" fill="url(#fillGrad)"/>
    <polyline points="${points}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${x(config.turnKm)}" y1="${margin.top}" x2="${x(config.turnKm)}" y2="${h-margin.bottom}" stroke="#10b981" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="${x(config.turnKm)}" y="${margin.top+17}" text-anchor="middle" fill="#047857" font-size="13" font-weight="800">반환점 10.55km</text>
    ${marker(maxP, '최고', '#ef4444', -38)}
    ${marker(minP, '최저', '#ef4444', 12)}
    <text x="${margin.left + iw/2}" y="${h-16}" text-anchor="middle" class="titleText">거리(km)</text>
    <text x="22" y="${margin.top + ih/2}" transform="rotate(-90 22 ${margin.top + ih/2})" text-anchor="middle" class="titleText">고도(m)</text>
    <line id="hoverLine" x1="${margin.left}" y1="${margin.top}" x2="${margin.left}" y2="${h-margin.bottom}" stroke="#111827" stroke-width="1" opacity="0" stroke-dasharray="4 4"/>
    <circle id="hoverDot" cx="${margin.left}" cy="${margin.top}" r="5" fill="#111827" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect id="hoverLayer" x="${margin.left}" y="${margin.top}" width="${iw}" height="${ih}" fill="transparent"/>
  `;
  chart.appendChild(svg);

  const hoverLayer = svg.querySelector('#hoverLayer');
  const hoverLine = svg.querySelector('#hoverLine');
  const hoverDot = svg.querySelector('#hoverDot');
  function nearest(km) {
    let idx = Math.round(km / 0.01);
    idx = Math.max(0, Math.min(data.length - 1, idx));
    return data[idx];
  }
  hoverLayer.addEventListener('mousemove', e => {
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const km = Math.max(0, Math.min(config.totalKm, ((mx - margin.left) / iw) * config.totalKm));
    const d = nearest(km);
    const px = x(d.km), py = y(d.ele);
    hoverLine.setAttribute('x1', px); hoverLine.setAttribute('x2', px); hoverLine.setAttribute('opacity', '.45');
    hoverDot.setAttribute('cx', px); hoverDot.setAttribute('cy', py); hoverDot.setAttribute('opacity', '1');
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<strong>${d.km.toFixed(2)}km · ${d.ele.toFixed(1)}m</strong><div>구간: ${d.section}</div><div>반환 기준 원본 위치: ${d.src.toFixed(2)}km</div>`;
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let left = px + 16, top = py - th - 12;
    if (left + tw > w - 8) left = px - tw - 16;
    if (top < 8) top = py + 16;
    tooltip.style.left = left + 'px'; tooltip.style.top = top + 'px';
  });
  hoverLayer.addEventListener('mouseleave', () => {
    tooltip.style.display = 'none'; hoverLine.setAttribute('opacity','0'); hoverDot.setAttribute('opacity','0');
  });
}
