<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청송트레일런 추가 접수 안내</title>
  <style>
    .notice-card {
      max-width: 540px;
      margin: 20px auto;
      padding: 24px;
      border: 1px solid #e5e7eb;
      border-left: 5px solid #dc2626;
      border-radius: 8px;
      background-color: #fff;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: #374151;
      line-height: 1.6;
    }
    .notice-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
    }
    .notice-body {
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    .alert-box {
      background-color: #fef2f2;
      border: 1px solid #fee2e2;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 0.9rem;
      color: #991b1b;
      margin-bottom: 14px;
    }
    .notice-footer {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1f2937;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="notice-card">
    <div class="notice-title">📢 추가 접수 및 환불 불가 안내</div>
    
    <div class="notice-body">
      안녕하세요, <strong>청송트레일런 운영사무국</strong>입니다.<br><br>
      현재 잔여석에 한해 추가 접수는 가능하나, 환불 기간이 마감되어 기념품 제작 및 행사 준비 일정상 <strong>8/30(일) 이후 신청 건은 환불이 불가</strong>합니다.
    </div>

    <div class="alert-box">
      ⚠️ 환불이 불가하오니 신중하게 검토 후 접수해 주시기 바랍니다.
    </div>
  </div>

</body>
</html>
