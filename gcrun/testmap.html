<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과천 마라톤 인터랙티브 코스도</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f8f9fa;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .filter-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-course {
      padding: 8px 16px;
      border: 1px solid #007bff;
      background: white;
      color: #007bff;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-course.active, .btn-course:hover {
      background: #007bff;
      color: white;
    }
    .btn-fullscreen {
      padding: 8px 16px;
      border: 1px solid #333;
      background: #333;
      color: white;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-fullscreen:hover {
      background: #555;
    }
    .map-wrapper {
      position: relative;
      width: 100%;
    }
    #map {
      width: 100%;
      height: 500px;
      border-radius: 8px;
    }
    /* 전체 화면 모드일 때 지도 높이 100% 조정 */
    #map:fullscreen {
      height: 100vh !important;
      border-radius: 0;
    }
    #map:-webkit-full-screen {
      height: 100vh !important;
      border-radius: 0;
    }
    /* 툴팁 커스텀 스타일 */
    .custom-tooltip {
      font-size: 13px;
      font-weight: bold;
      border-radius: 6px;
      padding: 6px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .legend {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      font-size: 13px;
      color: #555;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-color {
      width: 16px;
      height: 4px;
      border-radius: 2px;
    }
    .chart-container {
      position: relative;
      margin-top: 20px;
      height: 200px;
      width: 100%;
    }
    .info-panel {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }
    .info-badge {
      background: #e9ecef;
      padding: 8px 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h2 style="margin:0;">🏃‍♂️ 과천 마라톤 코스 & 고도 분석</h2>
    <button class="btn-fullscreen" onclick="toggleFullscreen()">⛶ 전체 화면 보기</button>
  </div>

  <!-- 종목 필터 버튼 -->
  <div class="filter-group" style="margin-bottom: 15px;">
    <span><strong>코스 선택:</strong></span>
    <button class="btn-course active" onclick="filterCourse('ALL')">전체 코스</button>
    <button class="btn-course" onclick="filterCourse('10K')">10km 코스</button>
    <button class="btn-course" onclick="filterCourse('HALF')">하프 코스</button>
  </div>

  <div class="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- 범례 -->
  <div class="legend">
    <div class="legend-item">
      <div class="legend-color" style="background: #007bff;"></div>
      <span>반환 전 (가는 길)</span>
    </div>
    <div class="legend-item">
      <div class="legend-color" style="background: #ff5500;"></div>
      <span>반환 후 (오는 길)</span>
    </div>
    <div class="legend-item">
      <span>💧 2.5km 간격 급수대</span>
    </div>
    <div class="legend-item">
      <span>🚩 0.68km 대회장 진입로</span>
    </div>
  </div>

  <div class="info-panel">
    <div class="info-badge" id="distInfo">총 거리: 계산 중...</div>
    <div class="info-badge" id="eleInfo">고도 정보: 계산 중...</div>
  </div>

  <div class="chart-container">
    <canvas id="elevationChart"></canvas>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map, outboundPolyline, inboundPolyline, hoverMarker, elevationChart;
  let markersGroup;
  let allTrackPoints = [];
  let currentDisplayPoints = [];
  let currentType = 'ALL';

  // 핵심 설정값
  const TURN_10K_DIST = 5.6;     // 10km 반환점 (5.6km 지점)
  const TURN_HALF_DIST = 10.65;   // 하프 반환점 (10.65km 지점)
  const WATER_INTERVAL = 2.5;    // 급수대 간격 (2.5km)
  const FINISH_BRANCH_DIST = 0.68; // 복귀 시 대회장으로 들어가는 분기점 (출발 기준 0.68km 지점)

  // 1. 배경 지도 레이어 설정
  const lightTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
  const darkTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' });
  const minimalTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' });
  const topoTile = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap' });
  const satelliteTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri' });

  map = L.map('map', {
    center: [37.441466, 126.996461],
    zoom: 14,
    layers: [lightTile]
  });

  const baseMaps = {
    "밝은 지도 (Light)": lightTile,
    "어두운 지도 (Dark)": darkTile,
    "간이 지도 (Minimal)": minimalTile,
    "지형도 (Terrain)": topoTile,
    "위성 사진 (Satellite)": satelliteTile
  };
  L.control.layers(baseMaps).addTo(map);

  markersGroup = L.layerGroup().addTo(map);

  // 러너 커서 마커
  const runnerIcon = L.divIcon({
    html: '<div style="font-size: 24px; transform: translate(-50%, -50%);">🏃</div>',
    className: 'runner-marker',
    iconSize: [30, 30]
  });
  hoverMarker = L.marker([0, 0], { icon: runnerIcon }).addTo(map);
  hoverMarker.setOpacity(0);

  // 지도 전체 화면 토글 함수
  function toggleFullscreen() {
    const mapElem = document.getElementById('map');
    if (!document.fullscreenElement) {
      if (mapElem.requestFullscreen) mapElem.requestFullscreen();
      else if (mapElem.webkitRequestFullscreen) mapElem.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  // Haversine 거리 계산 함수 (km)
  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // 2. GPX 자동 불러오기
  window.addEventListener('DOMContentLoaded', () => {
    fetch('files/과천마라톤.gpx')
      .then(res => {
        if(!res.ok) throw new Error('GPX 파일 로드 실패');
        return res.text();
      })
      .then(xmlText => {
        parseGPX(xmlText);
        filterCourse('ALL');
      })
      .catch(err => {
        document.getElementById('distInfo').innerText = err.message;
      });
  });

  // 3. GPX 데이터 파싱
  function parseGPX(xmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    const trkpts = xmlDoc.getElementsByTagName("trkpt");

    allTrackPoints = [];
    let accumDist = 0;

    for (let i = 0; i < trkpts.length; i++) {
      const lat = parseFloat(trkpts[i].getAttribute("lat"));
      const lon = parseFloat(trkpts[i].getAttribute("lon"));
      const eleNode = trkpts[i].getElementsByTagName("ele")[0];
      const ele = eleNode ? parseFloat(eleNode.textContent) : 0;

      if (i > 0) {
        const prev = allTrackPoints[i - 1];
        accumDist += getDistanceKm(prev.lat, prev.lng, lat, lon);
      }

      allTrackPoints.push({ lat, lng: lon, ele, dist: accumDist });
    }
  }

  function findPointAtDistance(points, targetDist) {
    let closest = points[0];
    let minDiff = Math.abs(points[0].dist - targetDist);
    for (let p of points) {
      const diff = Math.abs(p.dist - targetDist);
      if (diff < minDiff) {
        minDiff = diff;
        closest = p;
      }
    }
    return closest;
  }

  // 4. 종목별 코스 및 복귀(0.68km 진입) 동선 구성
  function filterCourse(type) {
    currentType = type;
    document.querySelectorAll('.btn-course').forEach(btn => btn.classList.remove('active'));
    event?.target?.classList.add('active');

    if (allTrackPoints.length === 0) return;

    let targetTurnDist = TURN_HALF_DIST;
    if (type === '10K') targetTurnDist = TURN_10K_DIST;
    else if (type === 'ALL') targetTurnDist = allTrackPoints[allTrackPoints.length - 1].dist / 2;

    // 가는 길 (출발 -> 반환점)
    const outbound = allTrackPoints.filter(p => p.dist <= targetTurnDist);
    const turnPt = findPointAtDistance(allTrackPoints, targetTurnDist);

    // 오는 길 (반환점 -> 출발기준 0.68km 지점까지만 역순 복귀)
    const inboundPart = outbound.filter(p => p.dist >= FINISH_BRANCH_DIST).reverse();

    // 0.68km 지점에서 최종 골인(FINISH) 지점으로 직행 연결
    const finishPt = allTrackPoints[allTrackPoints.length - 1]; // GPX의 골인 지점
    const branchPt = findPointAtDistance(allTrackPoints, FINISH_BRANCH_DIST);

    // 거리값 재계산 및 누적
    let currentAccumDist = turnPt.dist;
    const reconstructedInbound = [];

    for (let i = 0; i < inboundPart.length; i++) {
      if (i > 0) {
        const prev = inboundPart[i - 1];
        currentAccumDist += getDistanceKm(prev.lat, prev.lng, inboundPart[i].lat, inboundPart[i].lng);
      }
      reconstructedInbound.push({
        ...inboundPart[i],
        dist: currentAccumDist
      });
    }

    // 0.68km 지점에서 대회장(골인점)으로 직행 포인트 추가
    currentAccumDist += getDistanceKm(branchPt.lat, branchPt.lng, finishPt.lat, finishPt.lng);
    reconstructedInbound.push({
      ...finishPt,
      dist: currentAccumDist
    });

    currentDisplayPoints = [...outbound, ...reconstructedInbound];
    drawCourseAndChart();
  }

  // 5. 마커 및 코스선 그리기
  function drawCourseAndChart() {
    markersGroup.clearLayers();
    if (outboundPolyline) map.removeLayer(outboundPolyline);
    if (inboundPolyline) map.removeLayer(inboundPolyline);

    const totalPts = currentDisplayPoints.length;
    if (totalPts === 0) return;

    // 가는 길 / 오는 길 분할 인덱스
    const halfIndex = currentDisplayPoints.findIndex(p => p.lat === currentDisplayPoints[0].lat && p.lng === currentDisplayPoints[0].lng);
    const actualHalfIndex = halfIndex > 0 ? halfIndex : Math.floor(totalPts / 2);

    const outboundPts = currentDisplayPoints.slice(0, actualHalfIndex + 1).map(p => [p.lat, p.lng]);
    const inboundPts = currentDisplayPoints.slice(actualHalfIndex).map(p => [p.lat, p.lng]);

    // 반환 전 코스선 (파란색)
    outboundPolyline = L.polyline(outboundPts, {
      color: '#007bff',
      weight: 6,
      opacity: 0.85,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // 반환 후 코스선 (주황색)
    inboundPolyline = L.polyline(inboundPts, {
      color: '#ff5500',
      weight: 4,
      opacity: 0.95,
      dashArray: '8, 4',
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    const tooltipOptions = {
      permanent: false,
      direction: 'top',
      className: 'custom-tooltip',
      offset: [0, -5]
    };

    // ① 출발 / 도착 마커
    const startPt = currentDisplayPoints[0];
    const endPt = currentDisplayPoints[totalPts - 1];

    L.marker([startPt.lat, startPt.lng]).addTo(markersGroup)
      .bindTooltip('🏁 START (관문체육공원)', tooltipOptions);

    L.marker([endPt.lat, endPt.lng]).addTo(markersGroup)
      .bindTooltip('🎯 FINISH (대회장 진입)', tooltipOptions);

    // ② 반환점 마커
    const turnPt = currentDisplayPoints[actualHalfIndex];
    let turnLabel = '반환점';
    if (currentType === '10K') turnLabel = `🔄 10KM 반환점 (${TURN_10K_DIST}km 지점)`;
    else if (currentType === 'HALF') turnLabel = `🔄 하프 반환점 (${TURN_HALF_DIST}km 지점)`;
    else turnLabel = `🔄 반환점 (${turnPt.dist.toFixed(2)}km 지점)`;
    
    L.marker([turnPt.lat, turnPt.lng]).addTo(markersGroup)
      .bindTooltip(turnLabel, tooltipOptions);

    // ③ 0.68km 대회장 진입 분기점 마커
    const branchPt = findPointAtDistance(allTrackPoints, FINISH_BRANCH_DIST);
    L.circleMarker([branchPt.lat, branchPt.lng], {
      color: '#dc3545',
      fillColor: '#ff283d',
      fillOpacity: 0.9,
      radius: 9
    }).addTo(markersGroup)
      .bindTooltip(`🚩 <b>대회장 진입 분기점</b><br>출발 0.68km 지점에서 골인장 진입`, tooltipOptions);

    // ④ 2.5km 간격 급수대 마커 (가는 길 기준)
    const outboundDist = turnPt.dist;
    for (let targetD = WATER_INTERVAL; targetD < outboundDist; targetD += WATER_INTERVAL) {
      const waterPt = findPointAtDistance(allTrackPoints, targetD);
      
      const circleMarker = L.circleMarker([waterPt.lat, waterPt.lng], {
        color: '#0056b3',
        fillColor: '#00aaff',
        fillOpacity: 0.9,
        radius: 8
      }).addTo(markersGroup);

      circleMarker.bindTooltip(
        `💧 급수대 (${waterPt.dist.toFixed(1)}km)<br><span style="font-weight:normal; font-size:11px;">생수 및 이온음료 제공</span>`, 
        tooltipOptions
      );

      circleMarker.on('mouseover', function () { this.setRadius(11); });
      circleMarker.on('mouseout', function () { this.setRadius(8); });
    }

    // 통계 정보
    const totalDist = currentDisplayPoints[totalPts - 1].dist;
    const maxEle = Math.max(...currentDisplayPoints.map(p => p.ele));
    const minEle = Math.min(...currentDisplayPoints.map(p => p.ele));
    document.getElementById('distInfo').innerText = `총 거리: ${totalDist.toFixed(2)} km`;
    document.getElementById('eleInfo').innerText = `최고: ${maxEle.toFixed(1)} m / 최저: ${minEle.toFixed(1)} m`;

    map.fitBounds(outboundPolyline.getBounds());
    renderChart();
  }

  // 6. 고도 차트
  function renderChart() {
    const ctx = document.getElementById('elevationChart').getContext('2d');
    const labels = currentDisplayPoints.map(p => p.dist.toFixed(2));
    const data = currentDisplayPoints.map(p => p.ele.toFixed(1));

    if (elevationChart) elevationChart.destroy();

    elevationChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '고도 (m)',
          data: data,
          borderColor: '#007bff',
          backgroundColor: 'rgba(0, 123, 255, 0.15)',
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        scales: {
          x: {
            title: { display: true, text: '이동 거리 (km)' },
            ticks: { maxTicksLimit: 10 }
          },
          y: {
            title: { display: true, text: '고도 (m)' }
          }
        },
        plugins: {
          tooltip: {
            callbacks: {
              title: (items) => `거리: ${items[0].label} km`,
              label: (item) => `고도: ${item.formattedValue} m`
            }
          }
        },
        onHover: (event, activeElements) => {
          if (activeElements && activeElements.length > 0) {
            const index = activeElements[0].index;
            const pt = currentDisplayPoints[index];
            if (pt) {
              hoverMarker.setLatLng([pt.lat, pt.lng]);
              hoverMarker.setOpacity(1);
            }
          }
        }
      }
    });
  }
</script>
</body>
</html>
