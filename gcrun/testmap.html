<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>과천 마라톤 인터랙티브 코스도</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #08090a;
      --panel: rgba(15, 16, 18, .86);
      --surface: rgba(255, 255, 255, .045);
      --surface-strong: rgba(255, 255, 255, .075);
      --border: rgba(255, 255, 255, .09);
      --border-soft: rgba(255, 255, 255, .055);
      --text: #f7f8f8;
      --text-2: #d0d6e0;
      --muted: #8a8f98;
      --blue: #5e6ad2;
      --blue-2: #7170ff;
      --orange: #ff7a1a;
      --green: #27a644;
      --danger: #ff4d5e;
      --yellow: #f9e000;
      --shadow: 0 30px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    }
    * { box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 4%, rgba(94,106,210,.32), transparent 28%),
        radial-gradient(circle at 88% 10%, rgba(255,122,26,.15), transparent 24%),
        linear-gradient(180deg, #101114 0%, var(--bg) 64%);
      font-feature-settings: "cv01", "ss03";
    }
    .container {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .header-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }
    .title-block h2 {
      margin: 0;
      font-size: clamp(24px, 3.2vw, 38px);
      line-height: 1.05;
      letter-spacing: -1px;
      font-weight: 700;
    }
    .title-block p {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .map-actions,
    .filter-group,
    .kakao-layer-panel,
    .legend,
    .info-panel {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .map-actions { justify-content: flex-end; }
    .control-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid var(--border-soft);
      border-radius: 18px;
      background: rgba(255,255,255,.028);
    }
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .control-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    button {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.035);
      color: var(--text-2);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease;
    }
    button:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.18);
      background: rgba(255,255,255,.07);
      color: var(--text);
    }
    .btn-course.active,
    .btn-map-api.active,
    .btn-layer.active {
      border-color: rgba(113,112,255,.55);
      background: linear-gradient(135deg, var(--blue), var(--blue-2));
      color: #fff;
      box-shadow: 0 10px 25px rgba(94,106,210,.28);
    }
    .btn-map-api.kakao.active,
    .btn-map-api.kakao:hover {
      border-color: rgba(249,224,0,.75);
      background: var(--yellow);
      color: #3c1e1e;
      box-shadow: 0 10px 25px rgba(249,224,0,.18);
    }
    .btn-kakao,
    .btn-fullscreen {
      border-radius: 12px;
      padding: 10px 13px;
    }
    .btn-kakao {
      border-color: rgba(249,224,0,.7);
      background: rgba(249,224,0,.95);
      color: #3c1e1e;
    }
    .btn-fullscreen { background: rgba(255,255,255,.055); }
    .kakao-layer-panel {
      display: none;
      padding: 12px;
      border: 1px solid rgba(249,224,0,.22);
      border-radius: 16px;
      background: rgba(249,224,0,.075);
    }
    .kakao-layer-panel.visible { display: flex; }
    .map-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #111318;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 18px 50px rgba(0,0,0,.35);
    }
    #map,
    #kakaoMap {
      width: 100%;
      height: min(68vh, 660px);
      min-height: 520px;
      border-radius: 24px;
    }
    #kakaoMap { display: none; }
    #map:fullscreen,
    #kakaoMap:fullscreen,
    #map:-webkit-full-screen,
    #kakaoMap:-webkit-full-screen {
      height: 100vh !important;
      border-radius: 0;
    }
    .gps-locate-btn {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 800;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.55);
      background: rgba(12, 16, 22, .88);
      color: #fff;
      box-shadow: 0 14px 36px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.2);
      backdrop-filter: blur(12px);
    }
    .gps-locate-btn svg { width: 26px; height: 26px; }
    .gps-locate-btn.active {
      border-color: rgba(39,166,68,.85);
      background: rgba(39,166,68,.95);
      box-shadow: 0 0 0 7px rgba(39,166,68,.18), 0 14px 36px rgba(0,0,0,.36);
    }
    .custom-tooltip {
      border: 1px solid rgba(255,255,255,.14) !important;
      border-radius: 10px;
      padding: 7px 10px;
      color: #111318;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
    }
    .legend {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      background: rgba(255,255,255,.028);
      color: var(--muted);
      font-size: 12px;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-color { width: 22px; height: 4px; border-radius: 99px; }
    .location-status {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(39,166,68,.22);
      border-radius: 14px;
      background: rgba(39,166,68,.09);
      color: #b9f6c7;
      font-size: 13px;
      font-weight: 700;
    }
    .location-status.error {
      border-color: rgba(255,193,7,.32);
      background: rgba(255,193,7,.10);
      color: #ffe3a3;
    }
    .current-location-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      border: 3px solid #fff;
      box-shadow: 0 0 0 7px rgba(39,166,68,.26), 0 4px 14px rgba(0,0,0,.45);
    }
    .info-panel { margin-top: 14px; }
    .info-badge {
      padding: 12px 14px;
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
      color: var(--text-2);
      font-size: 13px;
      font-weight: 800;
    }
    .chart-container {
      position: relative;
      margin-top: 16px;
      height: 220px;
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      background: rgba(255,255,255,.035);
    }

    .file-input { display: none; }
    .btn-upload {
      border-radius: 12px;
      padding: 10px 13px;
      border-color: rgba(113,112,255,.4);
      background: rgba(113,112,255,.12);
      color: var(--text);
    }
    .btn-upload:hover { background: rgba(113,112,255,.22); }
    .btn-secondary {
      border-radius: 12px;
      padding: 10px 13px;
      background: rgba(255,255,255,.035);
    }
    .upload-status {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-width: 180px;
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .container { padding: 14px; border-radius: 20px; }
      .header-bar { grid-template-columns: 1fr; }
      .map-actions { justify-content: flex-start; }
      #map, #kakaoMap { min-height: 440px; height: 62vh; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <div class="title-block">
      <h2>과천 마라톤 코스맵</h2>
      <p>GPX 기반 코스, 반환점, 급수대, 고도 변화를 한 화면에서 확인합니다.</p>
    </div>
    <div class="map-actions">
      <button class="btn-kakao" onclick="openKakaoMap()">카카오맵 열기</button>
      <button class="btn-fullscreen" onclick="toggleFullscreen()">전체화면</button>
    </div>
  </div>

  <div class="control-panel">
    <div class="control-row">
      <span class="control-label">코스</span>
      <div class="filter-group">
        <button class="btn-course active" data-course="ALL" onclick="filterCourse('ALL', this)">전체</button>
        <button class="btn-course" data-course="10K" onclick="filterCourse('10K', this)">10km</button>
        <button class="btn-course" data-course="HALF" onclick="filterCourse('HALF', this)">하프</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">지도</span>
      <div class="filter-group map-api-group">
        <button id="leafletApiButton" class="btn-map-api" onclick="switchMapApi('leaflet')">Leaflet</button>
        <button id="kakaoApiButton" class="btn-map-api kakao active" onclick="switchMapApi('kakao')">카카오맵</button>
      </div>
    </div>
    <div class="control-row">
      <span class="control-label">GPX</span>
      <div class="filter-group">
        <input id="gpxFileInput" class="file-input" type="file" accept=".gpx,application/gpx+xml,text/xml,application/xml" onchange="handleGpxUpload(event)">
        <button class="btn-upload" onclick="document.getElementById('gpxFileInput').click()">GPX 업로드</button>
        <button id="resetGpxButton" class="btn-secondary" onclick="resetSavedGpx()" style="display:none;">기본 GPX로 복원</button>
        <span id="gpxUploadStatus" class="upload-status">기본 GPX 사용 중</span>
      </div>
    </div>
    <div id="kakaoLayerPanel" class="kakao-layer-panel visible">
      <span class="control-label">레이어</span>
      <button id="kakaoRoadmapButton" class="btn-layer active" onclick="setKakaoBaseLayer('roadmap')">일반</button>
      <button id="kakaoSkyviewButton" class="btn-layer" onclick="setKakaoBaseLayer('skyview')">스카이뷰</button>
      <button id="kakaoHybridButton" class="btn-layer" onclick="setKakaoBaseLayer('hybrid')">하이브리드</button>
      <button id="kakaoTrafficButton" class="btn-layer" onclick="toggleKakaoOverlay('traffic')">교통</button>
      <button id="kakaoBicycleButton" class="btn-layer" onclick="toggleKakaoOverlay('bicycle')">자전거</button>
      <button id="kakaoTerrainButton" class="btn-layer" onclick="toggleKakaoOverlay('terrain')">지형</button>
    </div>
  </div>

  <div class="map-wrapper">
    <div id="map"></div>
    <div id="kakaoMap"></div>
    <button id="gpsButton" class="gps-locate-btn" onclick="showCurrentLocation()" aria-label="내 위치 표시" title="내 위치 표시">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="6.5" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="2.4" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <div id="locationStatus" class="location-status"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background: #5e6ad2;"></div><span>가는 길</span></div>
    <div class="legend-item"><div class="legend-color" style="background: #ff7a1a;"></div><span>오는 길</span></div>
    <div class="legend-item"><span>💧 2.5km 급수대</span></div>
    <div class="legend-item"><span>🚩 0.68km 대회장 진입로</span></div>
  </div>

  <div class="info-panel">
    <div class="info-badge" id="distInfo">총 거리: 계산 중...</div>
    <div class="info-badge" id="eleInfo">고도 정보: 계산 중...</div>
  </div>

  <div class="chart-container">
    <canvas id="elevationChart"></canvas>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map, outboundPolyline, inboundPolyline, hoverMarker, elevationChart;
  let markersGroup;
  let currentLocationMarker, currentAccuracyCircle;
  let activeMapApi = 'leaflet';
  let kakaoMap = null;
  let kakaoSdkLoading = null;
  let kakaoOverlays = [];
  let kakaoCurrentLocationMarker = null;
  let kakaoCurrentAccuracyCircle = null;
  let kakaoBaseLayer = 'roadmap';
  const kakaoOverlayState = { traffic: false, bicycle: false, terrain: false };
  let currentPosition = null;
  let locationWatchId = null;
  let isFollowingLocation = false;
  let allTrackPoints = [];
  let currentDisplayPoints = [];
  let currentType = 'ALL';
  let currentTurnIndex = 0;
  const DEFAULT_GPX_PATH = 'files/과천마라톤.gpx';
  const SAVED_GPX_KEY = 'gcrun.testmap.savedGpxXml';
  const SAVED_GPX_NAME_KEY = 'gcrun.testmap.savedGpxName';

  // 핵심 설정값
  const TURN_10K_DIST = 5.6;     // 10km 반환점 (5.6km 지점)
  const TURN_HALF_DIST = 10.65;   // 하프 반환점 (10.65km 지점)
  const WATER_INTERVAL = 2.5;    // 급수대 간격 (2.5km)
  const FINISH_BRANCH_DIST = 0.68; // 복귀 시 대회장으로 들어가는 분기점 (출발 기준 0.68km 지점)
  // 카카오맵 SDK를 실제로 쓰려면 카카오 개발자 JavaScript 키를 입력하고 도메인을 등록하세요.
  const KAKAO_MAP_APP_KEY = 'c45e1e08eea53db5a726efa6edae142b';

  // 1. 배경 지도 레이어 설정
  const lightTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
  const darkTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' });
  const minimalTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' });
  const topoTile = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { attribution: '© OpenTopoMap' });
  const satelliteTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles © Esri' });

  map = L.map('map', {
    center: [37.441466, 126.996461],
    zoom: 14,
    layers: [lightTile]
  });

  const baseMaps = {
    "밝은 지도 (Light)": lightTile,
    "어두운 지도 (Dark)": darkTile,
    "간이 지도 (Minimal)": minimalTile,
    "지형도 (Terrain)": topoTile,
    "위성 사진 (Satellite)": satelliteTile
  };
  L.control.layers(baseMaps).addTo(map);

  markersGroup = L.layerGroup().addTo(map);

  // 러너 커서 마커
  const runnerIcon = L.divIcon({
    html: '<div style="font-size: 24px; transform: translate(-50%, -50%);">🏃</div>',
    className: 'runner-marker',
    iconSize: [30, 30]
  });
  hoverMarker = L.marker([0, 0], { icon: runnerIcon }).addTo(map);
  hoverMarker.setOpacity(0);

  const currentLocationIcon = L.divIcon({
    html: '<div class="current-location-dot"></div>',
    className: 'current-location-marker',
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });

  function setLocationStatus(message, isError = false) {
    const status = document.getElementById('locationStatus');
    status.textContent = message;
    status.classList.toggle('error', isError);
    status.style.display = 'block';
  }

  function handleLocationError(error) {
    const messages = {
      1: '위치 권한이 거부되었습니다. 브라우저 주소창의 위치 권한을 허용해 주세요.',
      2: '현재 위치를 확인할 수 없습니다. GPS/네트워크 상태를 확인해 주세요.',
      3: '현재 위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.'
    };
    setLocationStatus(messages[error.code] || '현재 위치를 확인하지 못했습니다.', true);
  }

  function updateCurrentLocation(position, followMap = true) {
    const { latitude, longitude, accuracy } = position.coords;
    const latlng = [latitude, longitude];
    currentPosition = { lat: latitude, lng: longitude, accuracy };

    if (!currentLocationMarker) {
      currentLocationMarker = L.marker(latlng, { icon: currentLocationIcon }).addTo(map);
    } else {
      currentLocationMarker.setLatLng(latlng);
    }

    if (!currentAccuracyCircle) {
      currentAccuracyCircle = L.circle(latlng, {
        radius: accuracy,
        color: '#27a644',
        fillColor: '#27a644',
        fillOpacity: 0.12,
        weight: 2
      }).addTo(map);
    } else {
      currentAccuracyCircle.setLatLng(latlng);
      currentAccuracyCircle.setRadius(accuracy);
    }

    currentLocationMarker.bindTooltip(
      `📍 현재 위치<br><span style="font-weight:normal; font-size:11px;">오차 범위 약 ${Math.round(accuracy)}m</span>`,
      { permanent: false, direction: 'top', className: 'custom-tooltip', offset: [0, -8] }
    );

    if (followMap && activeMapApi === 'leaflet') {
      map.panTo(latlng);
      currentLocationMarker.openTooltip();
    }
    syncKakaoCurrentLocation();

    document.getElementById('gpsButton')?.classList.add('active');
    setLocationStatus(`내 위치 표시 완료 · 오차 범위 약 ${Math.round(accuracy)}m`);
  }

  function showCurrentLocation() {
    if (!navigator.geolocation) {
      setLocationStatus('이 브라우저에서는 현재 위치 기능을 지원하지 않습니다.', true);
      return;
    }

    setLocationStatus('현재 위치를 확인하는 중입니다. 브라우저 위치 권한을 허용해 주세요.');

    navigator.geolocation.getCurrentPosition(
      (position) => updateCurrentLocation(position, true),
      handleLocationError,
      {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 10000
      }
    );
  }

  function toggleLocationTracking() {
    if (!navigator.geolocation) {
      setLocationStatus('이 브라우저에서는 내 위치 따라가기를 지원하지 않습니다.', true);
      return;
    }

    const button = document.getElementById('gpsButton');

    if (locationWatchId !== null) {
      navigator.geolocation.clearWatch(locationWatchId);
      locationWatchId = null;
      isFollowingLocation = false;
      button?.classList.remove('active');
      setLocationStatus('내 위치 따라가기를 중지했습니다.');
      return;
    }

    isFollowingLocation = true;
    button?.classList.add('active');
    setLocationStatus('내 위치를 확인하고 있습니다. 이동하면 지도가 현재 위치를 따라갑니다.');

    locationWatchId = navigator.geolocation.watchPosition(
      (position) => updateCurrentLocation(position, isFollowingLocation),
      (error) => {
        handleLocationError(error);
        if (locationWatchId !== null) {
          navigator.geolocation.clearWatch(locationWatchId);
          locationWatchId = null;
        }
        isFollowingLocation = false;
        button?.classList.remove('active');
      },
      {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 3000
      }
    );
  }

  function openKakaoMap() {
    let lat = 37.441466;
    let lng = 126.996461;
    let label = '과천마라톤 대회장';

    if (currentPosition) {
      lat = currentPosition.lat;
      lng = currentPosition.lng;
      label = '현재 위치';
    } else if (currentDisplayPoints.length > 0) {
      lat = currentDisplayPoints[0].lat;
      lng = currentDisplayPoints[0].lng;
      label = '과천마라톤 출발지';
    }

    const kakaoUrl = `https://map.kakao.com/link/map/${encodeURIComponent(label)},${lat},${lng}`;
    window.open(kakaoUrl, '_blank', 'noopener');
  }
 
  function setMapApiButton(api) {
    document.getElementById('leafletApiButton').classList.toggle('active', api === 'leaflet');
    document.getElementById('kakaoApiButton').classList.toggle('active', api === 'kakao');
    document.getElementById('kakaoLayerPanel').classList.toggle('visible', api === 'kakao');
  }

  function loadKakaoSdk() {
    if (window.kakao?.maps) return Promise.resolve();
    if (kakaoSdkLoading) return kakaoSdkLoading;
    if (!KAKAO_MAP_APP_KEY) {
      return Promise.reject(new Error('카카오맵 JavaScript 키가 필요합니다. KAKAO_MAP_APP_KEY 값을 입력하고 카카오 개발자센터에 도메인을 등록해 주세요.'));
    }

    kakaoSdkLoading = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_MAP_APP_KEY)}&autoload=false`;
      script.onload = () => {
        if (window.kakao?.maps) {
          kakao.maps.load(resolve);
        } else {
          reject(new Error('카카오맵 SDK 응답은 받았지만 maps 객체가 없습니다. JavaScript 키와 Web 도메인 등록을 확인해 주세요.'));
        }
      };
      script.onerror = () => {
        kakaoSdkLoading = null;
        reject(new Error('카카오맵 SDK를 불러오지 못했습니다. 카카오 Developers에서 JavaScript 키인지, 현재 도메인(http://localhost/127.0.0.1 또는 배포 도메인)이 Web 플랫폼에 등록되어 있는지 확인해 주세요.'));
      };
      document.head.appendChild(script);
    });
    return kakaoSdkLoading;
  }

  function switchMapApi(api) {
    if (api === activeMapApi) return;

    if (api === 'leaflet') {
      activeMapApi = 'leaflet';
      document.getElementById('map').style.display = 'block';
      document.getElementById('kakaoMap').style.display = 'none';
      setMapApiButton('leaflet');
      setTimeout(() => map.invalidateSize(), 0);
      setLocationStatus('Leaflet 지도로 전환했습니다.');
      return;
    }

    setLocationStatus('카카오맵으로 전환하는 중입니다.');
    loadKakaoSdk()
      .then(() => {
        activeMapApi = 'kakao';
        document.getElementById('map').style.display = 'none';
        document.getElementById('kakaoMap').style.display = 'block';
        setMapApiButton('kakao');
        initKakaoMap();
        drawKakaoCourse();
        syncKakaoCurrentLocation();
        setLocationStatus('카카오맵으로 전환했습니다.');
      })
      .catch((err) => {
        activeMapApi = 'leaflet';
        setMapApiButton('leaflet');
        setLocationStatus(err.message, true);
      });
  }

  function initKakaoMap() {
    if (kakaoMap) {
      kakao.maps.event.trigger(kakaoMap, 'resize');
      return;
    }
    kakaoMap = new kakao.maps.Map(document.getElementById('kakaoMap'), {
      center: new kakao.maps.LatLng(37.441466, 126.996461),
      level: 5
    });
    applyKakaoLayers();
  }

  function setKakaoBaseLayer(layer) {
    kakaoBaseLayer = layer;
    applyKakaoLayers();
  }

  function toggleKakaoOverlay(type) {
    kakaoOverlayState[type] = !kakaoOverlayState[type];
    applyKakaoLayers();
  }

  function setKakaoLayerButtonState() {
    document.getElementById('kakaoRoadmapButton').classList.toggle('active', kakaoBaseLayer === 'roadmap');
    document.getElementById('kakaoSkyviewButton').classList.toggle('active', kakaoBaseLayer === 'skyview');
    document.getElementById('kakaoHybridButton').classList.toggle('active', kakaoBaseLayer === 'hybrid');
    document.getElementById('kakaoTrafficButton').classList.toggle('active', kakaoOverlayState.traffic);
    document.getElementById('kakaoBicycleButton').classList.toggle('active', kakaoOverlayState.bicycle);
    document.getElementById('kakaoTerrainButton').classList.toggle('active', kakaoOverlayState.terrain);
  }

  function applyKakaoLayers() {
    setKakaoLayerButtonState();
    if (!kakaoMap || !window.kakao?.maps) return;

    const baseMapType = {
      roadmap: kakao.maps.MapTypeId.ROADMAP,
      skyview: kakao.maps.MapTypeId.SKYVIEW,
      hybrid: kakao.maps.MapTypeId.HYBRID
    }[kakaoBaseLayer] || kakao.maps.MapTypeId.ROADMAP;
    kakaoMap.setMapTypeId(baseMapType);

    const overlayTypes = {
      traffic: kakao.maps.MapTypeId.TRAFFIC,
      bicycle: kakao.maps.MapTypeId.BICYCLE,
      terrain: kakao.maps.MapTypeId.TERRAIN
    };
    Object.entries(overlayTypes).forEach(([key, value]) => {
      kakaoMap.removeOverlayMapTypeId(value);
      if (kakaoOverlayState[key]) kakaoMap.addOverlayMapTypeId(value);
    });
  }

  function clearKakaoOverlays() {
    kakaoOverlays.forEach((overlay) => overlay.setMap(null));
    kakaoOverlays = [];
  }

  function addKakaoOverlay(overlay) {
    overlay.setMap(kakaoMap);
    kakaoOverlays.push(overlay);
  }

  function drawKakaoCourse() {
    if (!kakaoMap || !window.kakao?.maps || currentDisplayPoints.length === 0) return;
    clearKakaoOverlays();

    const totalPts = currentDisplayPoints.length;
    const actualHalfIndex = currentTurnIndex > 0 ? currentTurnIndex : Math.floor(totalPts / 2);
    const outboundPath = currentDisplayPoints.slice(0, actualHalfIndex + 1).map(p => new kakao.maps.LatLng(p.lat, p.lng));
    const inboundPath = currentDisplayPoints.slice(actualHalfIndex).map(p => new kakao.maps.LatLng(p.lat, p.lng));

    addKakaoOverlay(new kakao.maps.Polyline({ path: outboundPath, strokeWeight: 6, strokeColor: '#5e6ad2', strokeOpacity: 0.9, strokeStyle: 'solid' }));
    addKakaoOverlay(new kakao.maps.Polyline({ path: inboundPath, strokeWeight: 4, strokeColor: '#ff7a1a', strokeOpacity: 0.95, strokeStyle: 'dash' }));

    const startPt = currentDisplayPoints[0];
    const endPt = currentDisplayPoints[totalPts - 1];
    const turnPt = currentDisplayPoints[actualHalfIndex];
    const branchPt = findPointAtDistance(allTrackPoints, FINISH_BRANCH_DIST);
    [startPt, endPt, turnPt, branchPt].forEach((pt) => addKakaoOverlay(new kakao.maps.Marker({ position: new kakao.maps.LatLng(pt.lat, pt.lng) })));

    const bounds = new kakao.maps.LatLngBounds();
    outboundPath.concat(inboundPath).forEach((latLng) => bounds.extend(latLng));
    kakaoMap.setBounds(bounds);
  }

  function syncKakaoCurrentLocation() {
    if (!kakaoMap || !window.kakao?.maps || !currentPosition) return;
    const latlng = new kakao.maps.LatLng(currentPosition.lat, currentPosition.lng);
    if (!kakaoCurrentLocationMarker) {
      kakaoCurrentLocationMarker = new kakao.maps.Marker({ position: latlng, map: kakaoMap });
    } else {
      kakaoCurrentLocationMarker.setPosition(latlng);
      kakaoCurrentLocationMarker.setMap(kakaoMap);
    }
    if (!kakaoCurrentAccuracyCircle) {
      kakaoCurrentAccuracyCircle = new kakao.maps.Circle({
        center: latlng,
        radius: currentPosition.accuracy,
        strokeWeight: 2,
        strokeColor: '#27a644',
        strokeOpacity: 0.9,
        fillColor: '#27a644',
        fillOpacity: 0.12,
        map: kakaoMap
      });
    } else {
      kakaoCurrentAccuracyCircle.setPosition(latlng);
      kakaoCurrentAccuracyCircle.setRadius(currentPosition.accuracy);
      kakaoCurrentAccuracyCircle.setMap(kakaoMap);
    }
    if (isFollowingLocation) kakaoMap.setCenter(latlng);
  }

  // 지도 전체 화면 토글 함수
  function toggleFullscreen() {
    const mapElem = document.getElementById(activeMapApi === 'kakao' ? 'kakaoMap' : 'map');
    if (!document.fullscreenElement) {
      if (mapElem.requestFullscreen) mapElem.requestFullscreen();
      else if (mapElem.webkitRequestFullscreen) mapElem.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  // Haversine 거리 계산 함수 (km)
  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function updateGpxUploadStatus(message, hasSaved = false) {
    const status = document.getElementById('gpxUploadStatus');
    const resetButton = document.getElementById('resetGpxButton');
    if (status) status.textContent = message;
    if (resetButton) resetButton.style.display = hasSaved ? 'inline-flex' : 'none';
  }

  function loadGpxXml(xmlText, sourceLabel = 'GPX') {
    parseGPX(xmlText);
    filterCourse(currentType || 'ALL');
    if (activeMapApi === 'kakao') drawKakaoCourse();
    const total = allTrackPoints.length ? allTrackPoints[allTrackPoints.length - 1].dist.toFixed(2) : '0.00';
    setLocationStatus(`${sourceLabel} 적용 완료 · ${allTrackPoints.length.toLocaleString()}개 포인트 · 원본 ${total}km`);
  }

  function handleGpxUpload(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const xmlText = String(reader.result || '');
        loadGpxXml(xmlText, file.name);
        try {
          localStorage.setItem(SAVED_GPX_KEY, xmlText);
          localStorage.setItem(SAVED_GPX_NAME_KEY, file.name);
          updateGpxUploadStatus(`저장됨: ${file.name}`, true);
        } catch (storageError) {
          updateGpxUploadStatus(`임시 적용: ${file.name}`, false);
          setLocationStatus('GPX는 적용됐지만 브라우저 저장공간 제한으로 저장하지 못했습니다.', true);
        }
      } catch (err) {
        setLocationStatus(`GPX 파일을 읽지 못했습니다: ${err.message}`, true);
      } finally {
        event.target.value = '';
      }
    };
    reader.onerror = () => setLocationStatus('GPX 파일을 읽는 중 오류가 발생했습니다.', true);
    reader.readAsText(file);
  }

  function resetSavedGpx() {
    localStorage.removeItem(SAVED_GPX_KEY);
    localStorage.removeItem(SAVED_GPX_NAME_KEY);
    updateGpxUploadStatus('기본 GPX 사용 중', false);
    fetch(DEFAULT_GPX_PATH)
      .then(res => {
        if(!res.ok) throw new Error('GPX 파일 로드 실패');
        return res.text();
      })
      .then(xmlText => loadGpxXml(xmlText, '기본 GPX'))
      .catch(err => {
        document.getElementById('distInfo').innerText = err.message;
        setLocationStatus('기본 GPX 파일을 불러오지 못했습니다. files/과천마라톤.gpx 경로를 확인해 주세요.', true);
      });
  }

  // 2. GPX 자동 불러오기
  window.addEventListener('DOMContentLoaded', () => {
    setKakaoLayerButtonState();
    setMapApiButton('kakao');
    switchMapApi('kakao');

    const savedGpx = localStorage.getItem(SAVED_GPX_KEY);
    const savedName = localStorage.getItem(SAVED_GPX_NAME_KEY) || '업로드 GPX';
    if (savedGpx) {
      updateGpxUploadStatus(`저장됨: ${savedName}`, true);
      loadGpxXml(savedGpx, savedName);
      return;
    }

    fetch(DEFAULT_GPX_PATH)
      .then(res => {
        if(!res.ok) throw new Error('GPX 파일 로드 실패');
        return res.text();
      })
      .then(xmlText => {
        updateGpxUploadStatus('기본 GPX 사용 중', false);
        loadGpxXml(xmlText, '기본 GPX');
      })
      .catch(err => {
        document.getElementById('distInfo').innerText = err.message;
        setLocationStatus('GPX 파일을 불러오지 못했습니다. files/과천마라톤.gpx 경로를 확인해 주세요.', true);
      });
  });

  // 3. GPX 데이터 파싱
  function parseGPX(xmlText) {
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
    if (xmlDoc.getElementsByTagName('parsererror').length) {
      throw new Error('올바른 GPX/XML 형식이 아닙니다.');
    }
    const trkpts = xmlDoc.getElementsByTagName("trkpt");
    if (trkpts.length === 0) {
      throw new Error('GPX 트랙 포인트(trkpt)가 없습니다.');
    }

    allTrackPoints = [];
    let accumDist = 0;

    for (let i = 0; i < trkpts.length; i++) {
      const lat = parseFloat(trkpts[i].getAttribute("lat"));
      const lon = parseFloat(trkpts[i].getAttribute("lon"));
      const eleNode = trkpts[i].getElementsByTagName("ele")[0];
      const ele = eleNode ? parseFloat(eleNode.textContent) : 0;

      if (i > 0) {
        const prev = allTrackPoints[i - 1];
        accumDist += getDistanceKm(prev.lat, prev.lng, lat, lon);
      }

      allTrackPoints.push({ lat, lng: lon, ele, dist: accumDist });
    }
  }

  function findPointAtDistance(points, targetDist) {
    let closest = points[0];
    let minDiff = Math.abs(points[0].dist - targetDist);
    for (let p of points) {
      const diff = Math.abs(p.dist - targetDist);
      if (diff < minDiff) {
        minDiff = diff;
        closest = p;
      }
    }
    return closest;
  }

  // 4. 종목별 코스 및 복귀(0.68km 진입) 동선 구성
  function filterCourse(type, button = null) {
    currentType = type;
    document.querySelectorAll('.btn-course').forEach(btn => btn.classList.toggle('active', btn.dataset.course === type));
    if (button) button.classList.add('active');

    if (allTrackPoints.length === 0) return;

    let targetTurnDist = TURN_HALF_DIST;
    if (type === '10K') targetTurnDist = TURN_10K_DIST;
    else if (type === 'ALL') targetTurnDist = allTrackPoints[allTrackPoints.length - 1].dist / 2;

    // 가는 길 (출발 -> 반환점)
    const outbound = allTrackPoints.filter(p => p.dist <= targetTurnDist);
    const turnPt = findPointAtDistance(allTrackPoints, targetTurnDist);

    // 오는 길 (반환점 -> 출발기준 0.68km 지점까지만 역순 복귀)
    const inboundPart = outbound.filter(p => p.dist >= FINISH_BRANCH_DIST).reverse();

    // 0.68km 지점에서 최종 골인(FINISH) 지점으로 직행 연결
    const finishPt = allTrackPoints[allTrackPoints.length - 1]; // GPX의 골인 지점
    const branchPt = findPointAtDistance(allTrackPoints, FINISH_BRANCH_DIST);

    // 거리값 재계산 및 누적
    let currentAccumDist = turnPt.dist;
    const reconstructedInbound = [];

    for (let i = 0; i < inboundPart.length; i++) {
      if (i > 0) {
        const prev = inboundPart[i - 1];
        currentAccumDist += getDistanceKm(prev.lat, prev.lng, inboundPart[i].lat, inboundPart[i].lng);
      }
      reconstructedInbound.push({
        ...inboundPart[i],
        dist: currentAccumDist
      });
    }

    // 0.68km 지점에서 대회장(골인점)으로 직행 포인트 추가
    currentAccumDist += getDistanceKm(branchPt.lat, branchPt.lng, finishPt.lat, finishPt.lng);
    reconstructedInbound.push({
      ...finishPt,
      dist: currentAccumDist
    });

    currentDisplayPoints = [...outbound, ...reconstructedInbound];
    currentTurnIndex = Math.max(0, outbound.length - 1);
    drawCourseAndChart();
    if (activeMapApi === 'kakao') drawKakaoCourse();
  }

  // 5. 마커 및 코스선 그리기
  function drawCourseAndChart() {
    markersGroup.clearLayers();
    if (outboundPolyline) map.removeLayer(outboundPolyline);
    if (inboundPolyline) map.removeLayer(inboundPolyline);

    const totalPts = currentDisplayPoints.length;
    if (totalPts === 0) return;

    // 가는 길 / 오는 길 분할 인덱스
    const actualHalfIndex = currentTurnIndex > 0 ? currentTurnIndex : Math.floor(totalPts / 2);

    const outboundPts = currentDisplayPoints.slice(0, actualHalfIndex + 1).map(p => [p.lat, p.lng]);
    const inboundPts = currentDisplayPoints.slice(actualHalfIndex).map(p => [p.lat, p.lng]);

    // 반환 전 코스선 (파란색)
    outboundPolyline = L.polyline(outboundPts, {
      color: '#5e6ad2',
      weight: 6,
      opacity: 0.85,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // 반환 후 코스선 (주황색)
    inboundPolyline = L.polyline(inboundPts, {
      color: '#ff7a1a',
      weight: 4,
      opacity: 0.95,
      dashArray: '8, 4',
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    const tooltipOptions = {
      permanent: false,
      direction: 'top',
      className: 'custom-tooltip',
      offset: [0, -5]
    };

    // ① 출발 / 도착 마커
    const startPt = currentDisplayPoints[0];
    const endPt = currentDisplayPoints[totalPts - 1];

    L.marker([startPt.lat, startPt.lng]).addTo(markersGroup)
      .bindTooltip('🏁 START (관문체육공원)', tooltipOptions);

    L.marker([endPt.lat, endPt.lng]).addTo(markersGroup)
      .bindTooltip('🎯 FINISH (대회장 진입)', tooltipOptions);

    // ② 반환점 마커
    const turnPt = currentDisplayPoints[actualHalfIndex];
    let turnLabel = '반환점';
    if (currentType === '10K') turnLabel = `🔄 10KM 반환점 (${TURN_10K_DIST}km 지점)`;
    else if (currentType === 'HALF') turnLabel = `🔄 하프 반환점 (${TURN_HALF_DIST}km 지점)`;
    else turnLabel = `🔄 반환점 (${turnPt.dist.toFixed(2)}km 지점)`;
    
    L.marker([turnPt.lat, turnPt.lng]).addTo(markersGroup)
      .bindTooltip(turnLabel, tooltipOptions);

    // ③ 0.68km 대회장 진입 분기점 마커
    const branchPt = findPointAtDistance(allTrackPoints, FINISH_BRANCH_DIST);
    L.circleMarker([branchPt.lat, branchPt.lng], {
      color: '#dc3545',
      fillColor: '#ff283d',
      fillOpacity: 0.9,
      radius: 9
    }).addTo(markersGroup)
      .bindTooltip(`🚩 <b>대회장 진입 분기점</b><br>출발 0.68km 지점에서 골인장 진입`, tooltipOptions);

    // ④ 2.5km 간격 급수대 마커 (가는 길 기준)
    const outboundDist = turnPt.dist;
    for (let targetD = WATER_INTERVAL; targetD < outboundDist; targetD += WATER_INTERVAL) {
      const waterPt = findPointAtDistance(allTrackPoints, targetD);
      
      const circleMarker = L.circleMarker([waterPt.lat, waterPt.lng], {
        color: '#3b82f6',
        fillColor: '#38bdf8',
        fillOpacity: 0.9,
        radius: 8
      }).addTo(markersGroup);

      circleMarker.bindTooltip(
        `💧 급수대 (${waterPt.dist.toFixed(1)}km)<br><span style="font-weight:normal; font-size:11px;">생수 및 이온음료 제공</span>`, 
        tooltipOptions
      );

      circleMarker.on('mouseover', function () { this.setRadius(11); });
      circleMarker.on('mouseout', function () { this.setRadius(8); });
    }

    // 통계 정보
    const totalDist = currentDisplayPoints[totalPts - 1].dist;
    const maxEle = Math.max(...currentDisplayPoints.map(p => p.ele));
    const minEle = Math.min(...currentDisplayPoints.map(p => p.ele));
    document.getElementById('distInfo').innerText = `총 거리: ${totalDist.toFixed(2)} km`;
    document.getElementById('eleInfo').innerText = `최고: ${maxEle.toFixed(1)} m / 최저: ${minEle.toFixed(1)} m`;

    map.fitBounds(outboundPolyline.getBounds());
    renderChart();
  }

  // 6. 고도 차트
  function renderChart() {
    const ctx = document.getElementById('elevationChart').getContext('2d');
    const labels = currentDisplayPoints.map(p => p.dist.toFixed(2));
    const data = currentDisplayPoints.map(p => p.ele.toFixed(1));

    if (elevationChart) elevationChart.destroy();

    elevationChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '고도 (m)',
          data: data,
          borderColor: '#7170ff',
          backgroundColor: 'rgba(113, 112, 255, 0.18)',
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 6,
          borderWidth: 2,
          tension: 0.1
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        scales: {
          x: {
            title: { display: true, text: '이동 거리 (km)' },
            ticks: { maxTicksLimit: 10 }
          },
          y: {
            title: { display: true, text: '고도 (m)' }
          }
        },
        plugins: {
          tooltip: {
            callbacks: {
              title: (items) => `거리: ${items[0].label} km`,
              label: (item) => `고도: ${item.formattedValue} m`
            }
          }
        },
        onHover: (event, activeElements) => {
          if (activeElements && activeElements.length > 0) {
            const index = activeElements[0].index;
            const pt = currentDisplayPoints[index];
            if (pt) {
              hoverMarker.setLatLng([pt.lat, pt.lng]);
              hoverMarker.setOpacity(1);
            }
          }
        }
      }
    });
  }
</script>
