<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <style>
        /* 네임스페이스: pt-clean- */
        .pt-clean-wrap {
            max-width: 500px;
            margin: 40px auto;
            padding: 40px;
            border: 1px solid #eee;
            border-radius: 0; /* 각진 디자인으로 신뢰감 부여 */
            font-family: 'Pretendard', sans-serif;
            color: #222;
            line-height: 1.7;
            text-align: center;
        }

        .pt-clean-title {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            color: #000;
        }

        .pt-clean-content {
            margin-bottom: 30px;
        }

        .pt-clean-date {
            font-size: 18px;
            color: #d32f2f; /* 강조 색상 */
            font-weight: 700;
        }

        .pt-clean-desc {
            margin-top: 15px;
            font-size: 15px;
            color: #444;
        }

        .pt-clean-box {
            background-color: #f9f9f9;
            padding: 20px;
        }

        .pt-clean-reason {
            display: flex;
            font-size: 14px;
            color: #666;
        }

        .pt-clean-label {
            width: 60px;
            font-weight: bold;
            color: #222;
        }

        .pt-clean-footer {
            margin-top: 40px;
            font-size: 15px;
            color: #888;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="pt-clean-wrap">
        <h2 class="pt-clean-title">2026 평택시민건강걷기대회 환불 신청 마감 안내</h2>

        <div class="pt-clean-content">
            <span class="pt-clean-date">환불 신청 마감일: 3월 15일(일)</span>
            <p class="pt-clean-desc">
                2026 평택시민건강걷기대회 신규 환불 신청이 종료됩니다.<br>

                <strong>이후 접수 및 결제 건은 환불이 불가</strong>하오니 유의 바랍니다.
            </p>
        </div>

        <div class="pt-clean-box">
            <div class="pt-clean-reason">
                <div class="pt-clean-label">사유</div>
                <div>대회 일정 임박으로 인한 참가자 정보 확정 및 기념품 발주</div>
            </div>
        </div>
    </div>

</body>
</html>
