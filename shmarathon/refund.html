<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 시흥시전국하프마라톤대회 - 환불 기간 안내</title>
    <style>
        body.shn-refund-page {
            background-color: #e8f4fb;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .shn-refund,
        .shn-refund * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
        }

        .shn-refund {
            width: 800px;
            min-height: 760px;
            position: relative;
            overflow: hidden;
            color: #102b57;
            background:
                radial-gradient(circle at 78% 8%, rgba(255, 255, 255, .65) 0 90px, transparent 91px),
                linear-gradient(180deg, #a9d8ee 0%, #a6d4ea 38%, #8fa9d2 68%, #76559c 100%);
            box-shadow: 0 4px 18px rgba(0, 0, 0, .12);
            display: flex;
            flex-direction: column;
        }

        .shn-refund::before,
        .shn-refund::after {
            content: '';
            position: absolute;
            left: -8%;
            right: -8%;
            height: 220px;
            border-radius: 50% 50% 0 0;
            pointer-events: none;
        }

        .shn-refund::before {
            top: 430px;
            background: rgba(53, 98, 154, .28);
            transform: rotate(-4deg);
        }

        .shn-refund::after {
            bottom: -92px;
            background: rgba(73, 34, 118, .35);
            transform: rotate(5deg);
        }

        .shn-refund__top-stripe {
            height: 24px;
            min-height: 24px;
            flex: 0 0 24px;
            display: flex;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        .shn-refund__stripe-navy { flex: 1; background-color: #082e5f; }
        .shn-refund__stripe-blue { flex: 1; background-color: #02a7df; }
        .shn-refund__stripe-sky { flex: 1; background-color: #81d8f7; }
        .shn-refund__stripe-orange { flex: 1; background-color: #ff7a00; }
        .shn-refund__stripe-purple { flex: 1; background-color: #6d4b9c; }

        .shn-refund__content {
            position: relative;
            z-index: 3;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 46px 52px;
        }

        .shn-refund__header {
            margin-bottom: 34px;
            text-align: center;
        }

        .shn-refund__eyebrow {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            padding: 8px 20px;
            margin-bottom: 18px;
            border-radius: 999px;
            background: rgba(8, 46, 95, .92);
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: .04em;
        }

        .shn-refund__title {
            color: #082e5f;
            font-size: 42px;
            line-height: 1.25;
            font-weight: 950;
            letter-spacing: -0.045em;
            text-shadow:
                0 2px 0 rgba(255, 255, 255, .35),
                0 2px 8px rgba(255, 255, 255, .25);
            word-break: keep-all;
        }

        .shn-refund__main-card {
            background: rgba(255, 255, 255, .95);
            border: 3.5px solid #02a7df;
            border-radius: 26px;
            padding: 44px 36px;
            box-shadow: 0 20px 40px rgba(7, 35, 84, .22);
            text-align: center;
            margin-bottom: 26px;
        }

        .shn-refund__label {
            display: inline-block;
            padding: 8px 24px;
            border-radius: 999px;
            color: #fff;
            background: #ff7a00;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: .02em;
        }

        .shn-refund__deadline {
            font-size: 42px;
            line-height: 1.28;
            font-weight: 950;
            letter-spacing: -0.04em;
            color: #102b57;
            word-break: keep-all;
        }

        .shn-refund__deadline strong {
            color: #02a7df;
        }

        .shn-refund__note {
            margin-top: 16px;
            font-size: 20px;
            font-weight: 850;
            line-height: 1.5;
            color: #263e63;
            word-break: keep-all;
        }

        .shn-refund__note strong {
            color: #ff4b31;
        }

        .shn-refund__info-box {
            border-radius: 20px;
            background: rgba(7, 42, 89, .92);
            color: #fff;
            padding: 26px 30px;
            text-align: center;
            box-shadow: 0 14px 28px rgba(7, 35, 84, .18);
        }

        .shn-refund__info-label {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 999px;
            background: #ff7a00;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .shn-refund__info-text {
            font-size: 19px;
            font-weight: 850;
            line-height: 1.55;
            word-break: keep-all;
            color: #fff;
        }

        .shn-refund__info-text strong {
            color: #ffb34d;
        }

        .shn-refund__footer-banner {
            position: relative;
            z-index: 4;
            flex: 0 0 58px;
            min-height: 58px;
            background: #082e5f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 7px 22px 9px;
            font-size: 13px;
            line-height: 1.35;
            font-weight: 700;
        }

        .shn-refund__footer-banner strong {
            color: #ffb34d;
        }

        @media (max-width: 799px) {
            body.shn-refund-page { padding: 10px; }

            .shn-refund {
                width: 100%;
                min-height: auto;
            }

            .shn-refund__content {
                padding: 38px 24px;
            }

            .shn-refund__title,
            .shn-refund__deadline {
                font-size: 32px;
            }
        }
    </style>
</head>
<body class="shn-refund-page">

<div class="shn-refund">
    <div class="shn-refund__top-stripe" aria-hidden="true">
        <div class="shn-refund__stripe-navy"></div>
        <div class="shn-refund__stripe-blue"></div>
        <div class="shn-refund__stripe-sky"></div>
        <div class="shn-refund__stripe-orange"></div>
        <div class="shn-refund__stripe-purple"></div>
    </div>

    <div class="shn-refund__content">
        <header class="shn-refund__header">
            <div class="shn-refund__eyebrow">2026 제12회 시흥시전국하프마라톤대회</div>
            <h1 class="shn-refund__title">환불 기간 안내</h1>
        </header>

        <section class="shn-refund__main-card" aria-label="환불 기간">
            <div class="shn-refund__label">환불 신청 가능 기간</div>
            <div class="shn-refund__deadline">
                <strong>8/2(일) 자정까지</strong>
            </div>
            <p class="shn-refund__note">
                해당 시각 이후에는 <strong>취소 및 환불 신청이 불가</strong>합니다.
            </p>
        </section>

        <section class="shn-refund__info-box" aria-label="환불 신청 안내">
            <span class="shn-refund__info-label">신청 안내</span>
            <p class="shn-refund__info-text">
                환불 신청은 <strong>공식 홈페이지</strong>를 통해서만 접수 가능합니다.
            </p>
        </section>
    </div>

    <div class="shn-refund__footer-banner">
        <div>
            접수 홈페이지_ <strong>www.shmarathon.kr</strong> &nbsp;|&nbsp; 문의_ <strong>1588-4929</strong>
        </div>
    </div>
</div>

</body>
</html>
