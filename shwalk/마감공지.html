<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가 접수 마감 - 제21회 수원화성걷기</title>
    <style>
        /* CSS 변수 설정: 이미지의 메인 컬러 테마 반영 */
        :root {
            --sh-primary-pink: #d81b60;
            --sh-dark-pink: #ad1457;
            --sh-bg-gray: #f8f9fa;
            --sh-text-main: #333;
            --sh-text-light: #666;
        }

        .sh-closed-wrapper {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--sh-bg-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .sh-closed-container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            margin: 20px;
        }

        .sh-closed-header {
            background-color: var(--sh-primary-pink);
            padding: 40px 20px;
            color: white;
        }

        .sh-closed-header img {
            max-width: 200px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .sh-closed-header h1 {
            font-size: 24px;
            margin: 10px 0;
            font-weight: 700;
            word-break: keep-all;
        }

        .sh-closed-body {
            padding: 50px 30px;
        }

        .sh-closed-icon {
            font-size: 50px;
            margin-bottom: 20px;
            display: block;
        }

        .sh-closed-title {
            font-size: 28px;
            color: var(--sh-primary-pink);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .sh-closed-message {
            font-size: 16px;
            line-height: 1.6;
            color: var(--sh-text-main);
            margin-bottom: 30px;
            word-break: keep-all;
        }

        .sh-closed-divider {
            width: 40px;
            height: 2px;
            background-color: #eee;
            margin: 0 auto 30px;
        }

        .sh-closed-info-box {
            background-color: #fff9fa;
            border: 1px solid #ffebee;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            margin-bottom: 30px;
        }

        .sh-closed-info-item {
            display: flex;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .sh-closed-info-label {
            width: 80px;
            font-weight: bold;
            color: var(--sh-primary-pink);
        }

        .sh-closed-info-value {
            color: var(--sh-text-light);
        }

        .sh-closed-footer-btn {
            display: inline-block;
            background-color: var(--sh-primary-pink);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        .sh-closed-footer-btn:hover {
            background-color: var(--sh-dark-pink);
        }

        .sh-closed-copyright {
            padding: 20px;
            font-size: 12px;
            color: #999;
            background: #f1f1f1;
        }
    </style>
</head>
<body class="sh-closed-wrapper">

    <div class="sh-closed-container">
        <div class="sh-closed-header">
            <!-- 참조 이미지 사용 -->
            <h1>2026 제21회 수원화성돌기</h1>
        </div>

        <div class="sh-closed-body">
            <div class="sh-closed-title">참가 접수 / 환불 신청 마감</div>
            <p class="sh-closed-message">
                2026 제21회 수원화성돌기 <strong>참가 신청 접수 / 환불 신청</strong>이 마감되었습니다.<br>
                신청하신 분들께는 대회 전 개별 문자를 통해 안내가 발송될 예정입니다.<br>
                많은 관심과 성원에 감사드립니다.
            </p>
    </div>

</body>
</html>
